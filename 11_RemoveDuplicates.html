          <script>
//Step 1 - remove Spaces from the string 
//Step 2 - Remove duplicate letters from the string, not case sensitive 

let input = prompt("Enter a String to Remove Spaces and Duplicates: ");

if (input) {
    let strWithoutSpaces = removeSpaces(input);
    let strWithoutDuplicates = removeDuplicates(strWithoutSpaces);
    let strWithoutDuplicates2 = removeDuplicates2(strWithoutSpaces);
    console.log("String without spaces and duplicates: " + strWithoutDuplicates);
        console.log("String without spaces and duplicates case insensitive: " + strWithoutDuplicates2);
} else {
    console.log("No input provided.");
}


function removeSpaces(input) {
    return input.replace(/\s+/g, '');
}

function removeDuplicates(input) {
    let output = '';
    let len = input.length;
    for (let i = 0; i < len; i++) {
        if (output.indexOf(input[i]) === -1) {
            output += input[i];
        }
    }
    return output;
}


function removeDuplicates2(input) {
    let output = '';
    let loweroutput = '';
    let len = input.length;
    for (let i = 0; i < len; i++) {
        if (loweroutput.indexOf(input[i].toLowerCase()) === -1) {
            loweroutput += input[i].toLowerCase();
            output += input[i];
        }
    }
    return output;
}
