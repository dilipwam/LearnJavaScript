<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops 1</title>
</head>
<body>
    <script>
        // While loop
        let i = 0;
        while (i < 5) {
            console.log("While Loop: " + i);
            i++;
        }

        // Do-while loop
        let j = 0;
        do {
            console.log("Do-While Loop: " + j);
            j++;
        } while (j < 5);

        // For loop
        for (let k = 0; k < 5; k++) {
            console.log("For Loop: " + k);
        }
    </script>


</body>
</html>
