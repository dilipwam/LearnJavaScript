<head>

</head>

        let address={

       document.getElementById("test2").innerHTML = "Hello, " + name + "! You are " + age + " years old. Your height is " + height + " feet. Are you employed? " + isEmployed + ". Your skills are: " + skills.join(", ") + ". Your address is: " + address.street + ", " + address.city + ", " + address.state + "."; // This changes the content of the div with id "test2"
