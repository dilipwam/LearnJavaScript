<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction</title>
</head>
<body>
    
    <script>
        // This is a comment in JavaScript
        console.log("Log, World!"); // This prints to the console
        alert("Alert, World!"); // This shows an alert box
        document.write("Write, World!"); // This writes to the document
    </script>

    <div id="test1" class="test1">Test 1</div>
<script>
    document.getElementById("test1").innerHTML = "Hello, World!"; // This changes the content of the div with id "test1"
    document.getElementById("test1").innerHTML += "Hello 55, World!"; // This changes the content of the div with id "test1"
    document.getElementById("test1").style.color = "red"; // This changes the text color of the div with id "test1"
    document.getElementById("test1").style.fontSize = "20px"; // This changes the font size of the div with id "test1"  
    document.getElementById("test1").style.fontWeight = "bold"; // This makes the text bold in the div with id "test1"
    document.getElementById("test1").style.backgroundColor = "yellow"; // This changes the background color of the div with id "test1"
    document.getElementById("test1").style.border = "2px solid black"; // This adds a border to the div with id "test1"
    document.getElementById("test1").style.padding = "10px"; // This adds padding to the div with id "test1"
    document.getElementById("test1").style.margin = "20px"; // This adds margin to the div with id "test1"
</script>





</body>
</html>
