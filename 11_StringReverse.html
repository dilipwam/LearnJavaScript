<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>Arrays</title>
</head>
<body>

    
    

          <script>
// Write a program to reverse a string without using built-in functions
let input = prompt("Enter a string to reverse: ");
let reversed = '';

for (let i = input.length - 1; i >= 0; i--) {
    reversed += input[i];
}
console.log("Reversed string: " + reversed);

// Write a program to reverse a string using built-in functions
//let input2 = prompt("Enter a string to reverse using built-in functions: ");
let reversed2 = input.split('').reverse().join('');
let reversed3 = input.split('').reverse();
console.log("Reversed string using built-in functions: " + reversed2);  
console.log("Reversed string using built-in functions 1: " + reversed3);  


</script>
    
</body>
</html>
